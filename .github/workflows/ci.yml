name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Same test set as the release (iOS simulator tests only run on macOS), so klib and
      # browser test failures show up on the PR instead of at release time.
      - run: ./gradlew allTests
